test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

private_exports:
  <% if ENV["RENDER_PREVIEW"] == "true" %>
  service: S3
  endpoint: <%= ENV.fetch("FIL_ENDPOINT") %>
  region: <%= ENV.fetch("FIL_REGION") %>
  bucket: <%= ENV.fetch("FIL_BUCKET") %>
  access_key_id: <%= ENV.fetch("FIL_ACCESS_KEY") %>
  secret_access_key: <%= ENV.fetch("FIL_SECRET_KEY") %>
  <% else %>
  service: Disk
  root: <%= Rails.root.join(Rails.env.test? ? "tmp/private_exports" : "storage/private_exports") %>
  <% end %>

preview:
  <% if ENV["RENDER_PREVIEW"] == "true" %>
  service: S3
  endpoint: <%= ENV.fetch("FIL_ENDPOINT") %>
  region: <%= ENV.fetch("FIL_REGION") %>
  bucket: <%= ENV.fetch("FIL_BUCKET") %>
  access_key_id: <%= ENV.fetch("FIL_ACCESS_KEY") %>
  secret_access_key: <%= ENV.fetch("FIL_SECRET_KEY") %>
  <% else %>
  service: Disk
  root: <%= Rails.root.join(Rails.env.test? ? "tmp/preview" : "storage/preview") %>
  <% end %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Use bin/rails credentials:edit to set the AWS secrets (as aws:access_key_id|secret_access_key)
# amazon:
#   service: S3
#   access_key_id: <%= Rails.application.credentials.dig(:aws, :access_key_id) %>
#   secret_access_key: <%= Rails.application.credentials.dig(:aws, :secret_access_key) %>
#   region: us-east-1
#   bucket: your_own_bucket-<%= Rails.env %>

# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
#   bucket: your_own_bucket-<%= Rails.env %>

