# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  cleanup_unattached_event_media:
    class: Events::CleanupUnattachedEventMediaJob
    queue: default
    schedule: every day at 3am
  expire_inventory_reservations:
    class: Catalog::ExpireInventoryReservationsJob
    queue: default
    schedule: every minute
  enter_payment_settlement_grace:
    class: Orders::EnterSettlementGraceJob
    queue: payments
    schedule: every minute
  reconcile_inventory:
    class: Catalog::ReconcileInventoryJob
    queue: default
    schedule: every day at 3am
  monitor_provider_reserves:
    class: Finance::ProviderReserveMonitorJob
    queue: default
    schedule: "*/5 * * * *"
  complete_due_events:
    class: Finance::CompleteDueEventsJob
    queue: default
    schedule: every minute
  expire_commercial_scheduled_state:
    class: Commercial::ExpireScheduledStateJob
    queue: default
    schedule: every minute
  reconcile_commercial_evidence:
    class: Commercial::ReconciliationJob
    queue: default
    schedule: every hour at minute 25
  compare_commercial_shadow:
    class: Commercial::ShadowComparisonJob
    queue: default
    schedule: every hour at minute 40
  expire_invitations:
    class: Ticketing::ExpireInvitationsJob
    queue: default
    schedule: every minute
  expire_credential_claims:
    class: Ticketing::ExpireCredentialClaimsJob
    queue: default
    schedule: every minute
  expire_ticket_transfers:
    class: Ticketing::ExpireTransfersJob
    queue: default
    schedule: every minute
  process_outbox:
    class: Core::ProcessOutboxJob
    queue: outbox
    schedule: every minute
  reconcile_fast:
    class: Reconciliation::SupervisorJob
    queue: maintenance
    args: [ "fast" ]
    schedule: <%= ENV.fetch("RECONCILIATION_FAST_SCHEDULE", "every minute") %>
  reconcile_slow:
    class: Reconciliation::SupervisorJob
    queue: maintenance
    args: [ "slow" ]
    schedule: <%= ENV.fetch("RECONCILIATION_SLOW_SCHEDULE", "every hour at minute 30") %>
  remind_pending_consents:
    class: Ticketing::ConsentReminderJob
    queue: default
    schedule: every day at 9am
  purge_retention_payloads:
    class: Core::RetentionPurgeJob
    queue: default
    schedule: every hour at minute 5
  process_messaging_notifications:
    class: Messaging::ProcessNotificationsJob
    queue: notifications
    schedule: every minute
  purge_messaging_notification_payloads:
    class: Messaging::PurgeNotificationPayloadsJob
    queue: notifications
    schedule: every hour at minute 10
  expire_attendee_exports:
    class: Ticketing::ExpireAttendeeExportsJob
    queue: default
    schedule: "*/5 * * * *"
  expire_stream_sessions:
    class: Streaming::ExpireSessionsJob
    queue: streaming
    schedule: every minute
  purge_expired_short_link_clicks:
    class: Links::PurgeExpiredClicksJob
    queue: default
    schedule: every day at 3am
  offer_waitlisted_registrations:
    class: Ticketing::OfferWaitlistJob
    queue: default
    schedule: every minute
  expire_waitlist_offers:
    class: Ticketing::ExpireWaitlistOffersJob
    queue: default
    schedule: every minute
  escalate_overdue_ticket_suspensions:
    class: Ticketing::EscalateOverdueSuspensionsJob
    queue: default
    schedule: every hour at minute 20
