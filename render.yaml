services:
  - type: web
    name: digis-backend-preview
    runtime: docker
    plan: free
    branch: feat/launch-hardening-telemetry
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RENDER_PREVIEW
        value: "true"
      - key: DIGIS_SEED_PROFILE
        value: preview
      - key: RENDER_PREVIEW_DATABASE_URL
        fromDatabase:
          name: digis-backend-preview-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: APP_HOST
        sync: false
      - key: APP_PROTOCOL
        value: https
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: JOB_CONCURRENCY
        value: "1"
      - key: JOB_THREADS
        value: "1"
      - key: WEB_CONCURRENCY
        value: "0"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: RAILS_MASTER_KEY
        sync: false
      - key: CORE_ENCRYPTION_PRIMARY_KEY
        sync: false
      - key: CORE_ENCRYPTION_DETERMINISTIC_KEY
        sync: false
      - key: CORE_ENCRYPTION_KEY_DERIVATION_SALT
        sync: false
      - key: ATTENDEE_EXPORT_HMAC_KEYS
        sync: false
      - key: TICKETING_QR_SIGNING_KEYS
        sync: false
      - key: TICKETING_QR_CURRENT_KID
        value: v1
      - key: FIL_ENDPOINT
        sync: false
      - key: FIL_REGION
        sync: false
      - key: FIL_BUCKET
        sync: false
      - key: FIL_ACCESS_KEY
        sync: false
      - key: FIL_SECRET_KEY
        sync: false
      - key: CHAPA_ENABLED
        value: "false"
      - key: CHAPA_MODE
        value: test
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: CHAPA_WEBHOOK_SECRET
        sync: false
      - key: CHAPA_API_BASE_URL
        value: https://api.chapa.co/v1
      - key: CHAPA_CALLBACK_URL
        sync: false
      - key: CHAPA_RETURN_URL
        sync: false

databases:
  - name: digis-backend-preview-db
    plan: free
